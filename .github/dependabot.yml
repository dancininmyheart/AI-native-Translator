version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /translation_core
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /translation_core/pi_agent
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
