name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python portable fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: translation_core
    env:
      FORMAT_TRANSLATOR_PPTX_LAYOUT_BACKEND: disabled
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.9.25
          enable-cache: true
          cache-dependency-glob: translation_core/uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Lint
        run: uv run --frozen --extra dev ruff check src tests tools

      - name: Test
        run: uv run --frozen --extra dev pytest -m "not office_integration"

      - name: Verify reproducible release package
        shell: pwsh
        run: |
          ./deploy/package-pi-agent-release.ps1 -ReleaseTag ci-repeat-a
          ./deploy/package-pi-agent-release.ps1 -ReleaseTag ci-repeat-b
          $first = (Get-FileHash -Algorithm SHA256 -LiteralPath release/format-translator-pi-agent-linux-ci-repeat-a.tar.gz).Hash
          $second = (Get-FileHash -Algorithm SHA256 -LiteralPath release/format-translator-pi-agent-linux-ci-repeat-b.tar.gz).Hash
          if ($first -ne $second) {
            throw "Identical Git index trees produced different release archives."
          }

  sidecar:
    name: Pi Agent portable fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FORMAT_TRANSLATOR_PPTX_LAYOUT_BACKEND: disabled
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: translation_core/pi_agent
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        # Patched post-v7 commit rebuilding dist for GHSA-3jxr-9vmj-r5cp (#1599).
        uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: translation_core/pi_agent/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.9.25
          enable-cache: true
          cache-dependency-glob: translation_core/uv.lock

      - name: Install Python
        run: uv python install 3.12
        working-directory: translation_core

      - name: Sync Python Core
        run: uv sync --frozen --extra dev --python 3.12
        working-directory: translation_core

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Compile TypeScript
        run: npm run build

      - name: Test
        run: npm test

      - name: Run public 20-case policy evaluation
        run: npm run eval:public

      - name: Verify generated evaluation reports
        run: >-
          node --input-type=module -e
          "import assert from 'node:assert/strict'; import { readFile } from 'node:fs/promises';
          const root = '../tmp/public-agent-eval';
          const summaryText = await readFile(root + '/eval-summary.json', 'utf8');
          const summary = JSON.parse(summaryText);
          const report = await readFile(root + '/eval-report.md', 'utf8');
          const index = JSON.parse(await readFile(root + '/corpus/fixture-index.json', 'utf8'));
          const baselineSummary = await readFile('../../evals/baselines/v1.0.0/eval-summary.json', 'utf8');
          const baselineReport = await readFile('../../evals/baselines/v1.0.0/eval-report.md', 'utf8');
          assert.equal(summary.model_calls, 0);
          assert.equal(summary.evidence_boundary.evaluation_scope, 'offline_orchestration_policy_replay');
          assert.equal(summary.evidence_boundary.pi_session, false);
          assert.equal(summary.evidence_boundary.native_model_eval, false);
          assert.equal(summary.evidence_boundary.corpus_provenance, 'synthetic_cc0');
          assert.equal(summary.evidence_boundary.qa_annotations, 'frozen_synthetic');
          assert.equal(summary.evidence_boundary.office_artifacts, 'runtime_generated_carriers');
          assert.equal(summary.evidence_boundary.replay_latency, 'deterministic_fixture_value_not_wall_clock');
          assert.equal(summary.strategies.length, 3);
          for (const strategy of summary.strategies) assert.equal(strategy.metrics.scenario_count, 20);
          assert.match(report, /model_calls=0/);
          assert.equal(index.license, 'CC0-1.0');
          assert.equal(index.model_calls, 0);
          assert.equal(summary.corpus_manifest_sha256, index.manifest_sha256);
          assert.equal(summaryText, baselineSummary);
          assert.equal(report, baselineReport);
          console.log('VERIFIED eval-summary.json, eval-report.md, and corpus/fixture-index.json');"

      - name: Export sanitized P1-A traces
        run: npm run trace:export:p1a

      - name: Validate and replay public trace schema
        run: |
          node dist/src/public-trace-cli.js validate ../tmp/p1a-public-traces/p1a-direct-docx.json
          node dist/src/public-trace-cli.js validate ../tmp/p1a-public-traces/p1a-repair-pptx.json
          node dist/src/public-trace-cli.js validate ../tmp/p1a-public-traces/p1a-high-risk-pptx.json
          node dist/src/public-trace-cli.js replay ../tmp/p1a-public-traces/p1a-high-risk-pptx.json

      - name: Test static trace viewer
        run: node --test ../../trace-viewer/test/viewer.test.mjs

      - name: Audit all dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/
