[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "format-translator-core"
version = "0.1.0"
description = "Format-faithful Word and PowerPoint translation core and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "lxml>=5.4",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.16.3",
]

[project.scripts]
format-translator = "format_translator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/format_translator"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "office_integration: requires a locally installed Office-compatible application",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
