name: format-translator-pi

services:
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    user: redis
    read_only: true
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --dir
      - /data
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  pi-agent:
    image: ${PI_AGENT_IMAGE:-format-translator-pi-agent:0.1.0}
    build:
      context: ../../..
      dockerfile: translation_core/deploy/linux/Dockerfile.agent
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    init: false
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:${PI_AGENT_HOST_PORT:-8080}:8080"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DOCUMENT_TRANSLATION_SKILL_DIR: /opt/format-translator/skills/document-translation
      PI_AGENT_HOST: 0.0.0.0
      PI_AGENT_PORT: 8080
      PI_AGENT_API_BEARER_TOKEN: ${PI_AGENT_API_BEARER_TOKEN:-}
      PI_AGENT_DATA_ROOT: /data
      PI_AGENT_JOBS_ROOT: /data/jobs
      PI_AGENT_UPLOADS_ROOT: /data/uploads
      PI_AGENT_CONFIG_DIR: /data/pi-config
      PI_AGENT_FIXTURE_MODE: "false"
      PI_AGENT_QUEUE_NAME: ${PI_AGENT_QUEUE_NAME:-format-translator-pi-agent}
      PI_AGENT_PYTHON_EXECUTABLE: /opt/format-translator/venv/bin/python
      PI_AGENT_PYTHON_MODULE: format_translator.agent_tool_cli
      PI_AGENT_PYTHON_TOOL_TIMEOUT_SECONDS: ${PI_AGENT_PYTHON_TOOL_TIMEOUT_SECONDS:-1200}
      PI_AGENT_MAX_INPUT_BYTES: ${PI_AGENT_MAX_INPUT_BYTES:-52428800}
      FORMAT_TRANSLATOR_JOB_ROOT: /data/jobs
      PI_AGENT_JOB_CONCURRENCY: ${PI_AGENT_JOB_CONCURRENCY:-20}
      PI_AGENT_PROVIDER_MAX_CONCURRENCY: ${PI_AGENT_PROVIDER_MAX_CONCURRENCY:-20}
      PI_AGENT_TRANSLATION_CONCURRENCY: ${PI_AGENT_TRANSLATION_CONCURRENCY:-4}
      PI_AGENT_RATE_LIMIT_MAX: ${PI_AGENT_RATE_LIMIT_MAX:-20}
      PI_AGENT_RATE_LIMIT_DURATION_MS: ${PI_AGENT_RATE_LIMIT_DURATION_MS:-1000}
      PI_AGENT_SOFT_TIMEOUT_SECONDS: ${PI_AGENT_SOFT_TIMEOUT_SECONDS:-1620}
      PI_AGENT_HARD_TIMEOUT_SECONDS: ${PI_AGENT_HARD_TIMEOUT_SECONDS:-2100}
      PI_AGENT_DEFAULT_REPAIR_ROUNDS: ${PI_AGENT_DEFAULT_REPAIR_ROUNDS:-2}
      PI_AGENT_HARD_MAX_REPAIR_ROUNDS: ${PI_AGENT_HARD_MAX_REPAIR_ROUNDS:-3}
      PI_AGENT_SEMANTIC_QA_ENABLED: ${PI_AGENT_SEMANTIC_QA_ENABLED:-true}
      PI_AGENT_PROCESSING_REPAIR_ENABLED: ${PI_AGENT_PROCESSING_REPAIR_ENABLED:-true}
      PI_MODEL_PROVIDER: ${PI_MODEL_PROVIDER:-translation-openai}
      PI_MODEL_ID: ${PI_MODEL_ID:-}
      PI_AGENT_THINKING_LEVEL: ${PI_AGENT_THINKING_LEVEL:-low}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      FORMAT_TRANSLATOR_PPTX_LAYOUT_BACKEND: libreoffice
      FORMAT_TRANSLATOR_SOFFICE_PATH: /usr/bin/libreoffice
      FORMAT_TRANSLATOR_LIBREOFFICE_MAX_WORKERS: ${FORMAT_TRANSLATOR_LIBREOFFICE_MAX_WORKERS:-3}
      FORMAT_TRANSLATOR_LIBREOFFICE_QUEUE_TIMEOUT_SECONDS: ${FORMAT_TRANSLATOR_LIBREOFFICE_QUEUE_TIMEOUT_SECONDS:-120}
      FORMAT_TRANSLATOR_LIBREOFFICE_TIMEOUT_SECONDS: ${FORMAT_TRANSLATOR_LIBREOFFICE_TIMEOUT_SECONDS:-120}
      FORMAT_TRANSLATOR_LIBREOFFICE_LOCK_DIRECTORY: /var/lock/format-translator/libreoffice
    volumes:
      - jobs-data:/data
      - libreoffice-locks:/var/lock/format-translator
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/format-translator/.cache:size=256m,mode=0700,uid=10001,gid=10001
    networks:
      - backend
      - egress
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 1024
    cpus: ${PI_AGENT_CPU_LIMIT:-8}
    mem_limit: ${PI_AGENT_MEMORY_LIMIT:-12g}
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  jobs-data:
  libreoffice-locks:
  redis-data:

networks:
  backend:
    internal: true
  egress:
